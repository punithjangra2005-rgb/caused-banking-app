###############################################################################
# Caused 2-Tier Banking Platform — Render Blueprint
# Deploy both Tier 1 (SaaS Frontend) and Tier 2 (Collector Backend) together
###############################################################################

services:
  # ── Tier 2: Collector Backend (FastAPI + Python via Docker) ────────────────
  - type: web
    name: caused-collector
    runtime: docker
    region: oregon
    plan: free
    rootDir: collector
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: DB_PATH
        value: "caused_vault.db"
      - key: GEMINI_API_KEY
        sync: false          # Prompts for manual entry in Render dashboard (never in Git)
      - key: FRONTEND_URL
        value: "https://caused-saas.onrender.com"
    buildFilter:
      paths:
        - collector/**

  # ── Tier 1: SaaS Frontend (React + Vite Static Site) ─────────────────────
  - type: web
    name: caused-saas
    runtime: static
    region: oregon
    plan: free
    rootDir: Saas platoform
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://caused-collector.onrender.com"
    buildFilter:
      paths:
        - "Saas platoform/**"
